#!/usr/sbin/nft -f
# Firewall for the DROP connectivity checker.
#
# The daemon makes outbound connections of its own (the probes), so output is
# left open and the replies come back as established. Inbound is default-deny
# with an explicit list.

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iif lo accept

    # ICMPv6 is not optional: dropping it breaks neighbour discovery and path
    # MTU, which on IPv6 means breaking the host.
    ip6 nexthdr icmpv6 icmpv6 type {
      destination-unreachable, packet-too-big, time-exceeded, parameter-problem,
      echo-request, echo-reply, nd-router-advert, nd-neighbor-solicit,
      nd-neighbor-advert, mld-listener-query
    } accept
    ip protocol icmp icmp type {
      destination-unreachable, time-exceeded, parameter-problem, echo-request
    } accept

    tcp dport 22 accept comment "ssh"
    tcp dport { 80, 443 } accept comment "drop control plane"
    tcp dport { 411, 412, 1511, 5000 } accept comment "drop egress banners"
    udp dport { 3478, 3479 } accept comment "drop stun"
  }

  chain forward { type filter hook forward priority filter; policy drop; }
  chain output  { type filter hook output  priority filter; policy accept; }
}
